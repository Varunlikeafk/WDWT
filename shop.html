<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WE DO WITHOUT TALKING | Shoes Collection</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --subtext-color: #a1a1aa;
            --glass-bg: rgba(18, 18, 18, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --logo-accent: #2c5282;
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-top: 100px; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* Navigation */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 4%; z-index: 1000; background: var(--glass-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border);
        }

        .brand-logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .brand-logo-text { display: flex; flex-direction: column; font-weight: 900; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; text-align: right; }
        .brand-logo-symbol { height: 38px; width: auto; }

        .nav-links { display: flex; gap: 2rem; list-style: none; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
        .nav-links a:hover { color: var(--logo-accent); }

        /* Controls & Filter Bar */
        .shop-section { padding: 2rem 4% 6rem; max-width: 1400px; margin: 0 auto; }
        
        .controls-bar { 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; 
            margin-bottom: 3rem; background: var(--glass-bg); padding: 1.2rem 2rem; border-radius: 16px; border: 1px solid var(--glass-border); 
        }

        .filter-btn { 
            background: transparent; border: 1px solid var(--glass-border); color: var(--text-color); 
            padding: 0.6rem 1.4rem; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.75rem; 
            letter-spacing: 1.5px; text-transform: uppercase; margin-right: 0.5rem; transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover { background: var(--btn-bg); color: var(--btn-text); }

        .sort-dropdown { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-color); 
            padding: 0.6rem 1.2rem; border-radius: 20px; font-weight: 700; font-size: 0.75rem; outline: none; cursor: pointer; 
        }

        /* Animated Grid & Products */
        .products-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;
            opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s ease; 
        }

        .products-grid.grid-animating {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
        }

        .product-card { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; 
            overflow: hidden; cursor: pointer; backdrop-filter: blur(10px); transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        .product-image-box { position: relative; height: 280px; overflow: hidden; background: #111; }
        .product-image-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-image-box img { transform: scale(1.08); }

        .badge-bestseller {
            position: absolute; top: 1rem; left: 1rem; background: var(--logo-accent); color: #fff;
            padding: 0.3rem 0.8rem; font-size: 0.65rem; font-weight: 800; letter-spacing: 1.5px; border-radius: 12px; text-transform: uppercase;
        }

        .product-info { padding: 1.5rem; }
        .product-category { font-size: 0.7rem; color: var(--subtext-color); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.3rem; }
        .product-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.8rem; }
        .product-price { font-size: 1.2rem; font-weight: 900; }

        /* Modal Overlay & E-Commerce Vertical Thumbnails Layout */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(15px); z-index: 2000; display: flex; justify-content: center; align-items: center; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; 
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); width: 92%; max-width: 980px; 
            border-radius: 24px; padding: 2.5rem; display: grid; grid-template-columns: 100px 1fr 1fr; gap: 1.5rem; position: relative; 
            max-height: 90vh; overflow-y: auto;
        }

        .modal-close { position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; cursor: pointer; color: var(--text-color); z-index: 10; }

        .thumbnail-col { 
            display: flex; flex-direction: column; gap: 0.8rem; 
        }

        .thumb-img { 
            width: 100%; height: 75px; object-fit: cover; border-radius: 8px; cursor: pointer; opacity: 0.6; border: 2px solid transparent; transition: all 0.2s ease; background: #111;
        }

        .thumb-img.active, .thumb-img:hover { opacity: 1; border-color: var(--logo-accent); }

        .main-modal-img { width: 100%; height: 420px; object-fit: cover; border-radius: 16px; background: #111; }

        .size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 1rem 0 1.5rem; }
        .size-btn { padding: 0.6rem; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color); border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; }
        .size-btn:hover, .size-btn.active { background: var(--btn-bg); color: var(--btn-text); }

        .pay-btn { 
            background: var(--btn-bg); color: var(--btn-text); padding: 1rem 2rem; border: none; 
            border-radius: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; width: 100%;
        }

        @media (max-width: 850px) {
            .modal-card { grid-template-columns: 1fr; }
            .thumbnail-col { flex-direction: row; order: 2; overflow-x: auto; }
            .thumb-img { width: 70px; height: 70px; flex-shrink: 0; }
            nav { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>

                    </div>
                </div>

                <button class="pay-btn" onclick="alert('Payments launching soon!')">Pay Now</button>
            </div>
        </div>

        let currentCategory = 'all';
        let currentSort = 'bestseller';

        function renderProductsWithAnimation() {
            const grid = document.getElementById('productsGrid');
            grid.classList.add('grid-animating');

            setTimeout(() => {
                grid.innerHTML = '';

                let filtered = shoesData.filter(s => currentCategory === 'all' || s.category === currentCategory);

                if (currentSort === 'low-high') filtered.sort((a, b) => a.price - b.price);
                else if (currentSort === 'high-low') filtered.sort((a, b) => b.price - a.price);
                else if (currentSort === 'bestseller') filtered.sort((a, b) => (b.bestseller === a.bestseller) ? 0 : b.bestseller ? 1 : -1);

                filtered.forEach(shoe => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => openModal(shoe.id);

                    card.innerHTML = `
                        <div class="product-image-box">
                            ${shoe.bestseller ? '<span class="badge-bestseller">Best Seller</span>' : ''}
                            <img src="${shoe.angles[0]}" alt="${shoe.name}">
                        </div>
                        <div class="product-info">
                            <div class="product-category">${shoe.category}</div>
                            <div class="product-title">${shoe.name}</div>
                            <div class="product-price">₹${shoe.price.toLocaleString('en-IN')}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                grid.classList.remove('grid-animating');
            }, 300);
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderProductsWithAnimation();
        }

        function sortProducts(sortVal) {
            currentSort = sortVal;
            renderProductsWithAnimation();
        }

        function openModal(id) {
            const shoe = shoesData.find(s => s.id === id);
            if (!shoe) return;

            document.getElementById('modalTitle').innerText = shoe.name;
            document.getElementById('modalPrice').innerText = `₹${shoe.price.toLocaleString('en-IN')}`;
            document.getElementById('modalDesc').innerText = shoe.desc;

            const mainImg = document.getElementById('modalMainImg');
            mainImg.src = shoe.angles[0];

            const thumbsContainer = document.getElementById('modalThumbs');
            thumbsContainer.innerHTML = '';

            shoe.angles.forEach((imgUrl, index) => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = `thumb-img ${index === 0 ? 'active' : ''}`;
                img.onclick = () => {
                    mainImg.src = imgUrl;
                    document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
                    img.classList.add('active');
                };
                thumbsContainer.appendChild(img);
            });

            document.getElementById('productModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const catParam = params.get('category');
            if (catParam) {
                currentCategory = catParam;
                const activeBtn = Array.from(document.querySelectorAll('.filter-btn')).find(b => b.textContent.toLowerCase().includes(catParam));
                if (activeBtn) {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    activeBtn.classList.add('active');
                }
            }
            renderProductsWithAnimation();
        });
